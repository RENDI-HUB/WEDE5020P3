<body class="enquire-page">

 
<header>
       <img src="images/giftToTheNationLogo.png" alt = "gift to the nation logo"width="150" height="150" style="display:block; float:left; margin:10px auto;">

<main class="panel-wrap">
   <section class="panel">
      <h2>Enquire</h2>

  <div class="form-container">
    <h2>Enquiry Form</h2>
  <form id="enquiryForm" action="https://jsonplaceholder.typicode.com/posts" method="post" novalidate>
      <label for="name">Full Name*</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email*</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone*</label>
<input type="tel" id="phone" name="phone" placeholder="082 123 4567">
<label for="quantity">Quantity / number of people*</label>
<input type="number" id="quantity" name="quantity" min="1" required>

      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option value="general">General Enquiry</option>
        <option value="donate">donate</option>
        <option value="sponsor">sponsor</option>
        <option value="volunteer">volunteer</option>
        <option value="charity-walk">Charity Walk</option>
      </select>

      <label for="message">Message*</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Send Enquiry</button>
            <div id= "responseMessage" aria-live="polite"></div>

    </form>
  
</main>
 <script src="js/myscript.js"></script>


</body>
</html>
